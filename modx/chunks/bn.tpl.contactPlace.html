<article class="cplace h-[[+code]]">
  <a class="cplace__photo" href="[[+url]]" tabindex="-1" aria-hidden="true"><img data-bn-sizes="(max-width: 760px) 100vw, 420px" src="[[+photo]]" alt="[[+name]], фасад" loading="lazy" decoding="async"></a>
  <div class="cplace__body">
    <h3><a href="[[+url]]">[[+name]]</a></h3>
    <p class="cplace__addr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Пермь, [[+addr]]</p>
    <p>Заезд с [[+checkin]], выезд до [[+checkout]]. Ночуют [[+sleep]], отдыхают до [[+max]] гостей. Посмотреть Дом можно ежедневно [[+view]].</p>
    <p class="cplace__links"><a class="link" href="https://yandex.ru/maps/?rtext=~[[+street_q]]&amp;rtt=auto" target="_blank" rel="noopener">Маршрут в Яндекс Картах</a><a class="link" href="https://2gis.ru/perm/search/[[+street_q]]" target="_blank" rel="noopener">Найти в 2ГИС</a></p>
    <div class="cplace__cta"><button class="btn btn--sm" type="button" data-order data-house="[[+code]]">Оставить заявку</button><a class="btn btn--sm" href="[[+prepay_url]]">Внести предоплату</a></div>
  </div>
</article>
