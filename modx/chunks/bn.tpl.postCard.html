<article class="pcard[[+big]]" data-cat="[[+cat]]">
  <a class="pcard__img" href="[[+url]]" tabindex="-1" aria-hidden="true"><img data-bn-sizes="(max-width: 760px) 100vw, 420px" src="[[+cover]]" alt="[[+cover_alt]]" loading="lazy" decoding="async"></a>
  <div class="pcard__body">
    <p class="pmeta"><span>[[+cat_name]]</span><span>[[+min]] мин чтения</span></p>
    <h3><a href="[[+url]]">[[+title]]</a></h3>
    <p>[[+text]]</p>
  </div>
</article>
