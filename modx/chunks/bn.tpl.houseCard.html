<article class="hcard h-[[+code]]">
  <div class="hcard__media">[[+media]]</div>
  <div class="hcard__body">
    <p class="hcard__kick">[[+kicker]]</p>
    <h3><a href="[[+url]]">[[+name]]</a></h3>
    <ul>[[+features]]</ul>
    <p class="hcard__price"><b class="tnum">от [[+min_price]]</b><span>за сутки</span><em class="disc">−[[++bn_discount]]% через ВКонтакте</em></p>
    <div class="hcard__cta"><button class="btn btn--sm" type="button" data-order data-house="[[+code]]">Оставить заявку</button><a class="btn btn--sm btn--tour" href="[[+tour]]" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>3D-тур</a></div>
    <p class="hcard__links"><a class="btn btn--sm" href="[[+prepay_url]]"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M7 15h4"/></svg>Внести предоплату</a><a href="[[+url]]">Подробнее о доме</a></p>
  </div>
</article>
