<article class="rev">
  <p class="rev__stars" aria-label="Оценка [[+stars]] из 5">[[+stars_on]]<span aria-hidden="true">[[+stars_off]]</span></p>
  <div class="rev__text">[[+text]]</div>
  <button class="rev__more" type="button" hidden>Читать полностью</button>
  <footer class="rev__foot"><b>[[+name]]</b>[[+meta]][[+source]]</footer>
</article>
